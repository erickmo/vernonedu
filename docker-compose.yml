version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vernonedu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vernonedu
      POSTGRES_PASSWORD: vernonedu_secret
      POSTGRES_DB: vernonedu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vernonedu"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vernonedu_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
