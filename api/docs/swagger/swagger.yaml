host: localhost:8081
info:
  contact:
    name: VernonEdu Dev Team
  description: |-
    Platform pendidikan — kurikulum, kelas, enrollment, sertifikat, accounting.
    Base URL: http://localhost:8081/api/v1
  title: VernonEdu API
  version: 1.0.0
paths:
  /accounting/balance:
    get:
      consumes:
      - application/json
      description: Get current balance for a specific chart of account code
      parameters:
      - description: Chart of Account code
        in: query
        name: coa_code
        required: true
        type: string
      - description: Filter by branch ID
        in: query
        name: branch_id
        type: string
      - description: Balance as of date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get balance by account
      tags:
      - accounting
  /accounting/bank-accounts:
    get:
      consumes:
      - application/json
      description: Get all bank accounts, optionally filtered by branch and inactive
        status
      parameters:
      - description: Filter by branch ID
        in: query
        name: branch_id
        type: string
      - description: Include inactive accounts
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List bank accounts
      tags:
      - accounting
    post:
      consumes:
      - application/json
      description: Create a new bank account linked to a branch
      parameters:
      - description: Bank account data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.CreateBankAccountRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create bank account
      tags:
      - accounting
  /accounting/bank-accounts/{id}:
    delete:
      consumes:
      - application/json
      description: Deactivate (soft delete) a bank account
      parameters:
      - description: Bank account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete bank account
      tags:
      - accounting
    get:
      consumes:
      - application/json
      description: Get a single bank account by its ID
      parameters:
      - description: Bank account ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get bank account by ID
      tags:
      - accounting
    put:
      consumes:
      - application/json
      description: Update an existing bank account
      parameters:
      - description: Bank account ID
        in: path
        name: id
        required: true
        type: string
      - description: Updated bank account data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_delivery_http.UpdateBankAccountRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update bank account
      tags:
      - accounting
  /accounting/budget-vs-actual:
    get:
      consumes:
      - application/json
      description: Compare budgeted amounts with actual spending for a given month
        and year
      parameters:
      - description: Month (1-12, defaults to current)
        in: query
        name: month
        type: integer
      - description: Year (defaults to current)
        in: query
        name: year
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get budget vs actual
      tags:
      - accounting
  /accounting/coa:
    get:
      consumes:
      - application/json
      description: Get the full chart of accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List chart of accounts
      tags:
      - accounting
  /accounting/coa/tree:
    get:
      consumes:
      - application/json
      description: Get the chart of accounts in a hierarchical tree structure
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
